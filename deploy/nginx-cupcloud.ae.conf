# /etc/nginx/sites-available/cupcloud.ae
# Cupcloud landing page — root domain
#
# This is the HTTP-only version. Certbot will rewrite this file to add
# HTTPS, automatic redirects, and SSL certificate paths on first run.

server {
    listen 80;
    listen [::]:80;
    server_name cupcloud.ae www.cupcloud.ae;

    root /var/www/cupcloud;
    index index.html;

    # Redirect www → root (after SSL is set up, certbot updates this)
    if ($host = www.cupcloud.ae) {
        return 301 http://cupcloud.ae$request_uri;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Cache static HTML modestly (5 min) so updates roll out fast
    location / {
        try_files $uri $uri/ =404;
        expires 5m;
        add_header Cache-Control "public, must-revalidate";
    }

    # Long cache for image/font assets if added later
    location ~* \.(jpg|jpeg|png|gif|webp|svg|woff2|woff|ttf|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # Logs
    access_log /var/log/nginx/cupcloud.ae.access.log;
    error_log  /var/log/nginx/cupcloud.ae.error.log;
}
